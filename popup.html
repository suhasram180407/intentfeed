<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap');

    :root {
      --red: #ff4444;
      --bg: #0a0a0a;
      --surface: #111;
      --surface2: #1a1a1a;
      --border: #252525;
      --text: #f0f0f0;
      --dim: #888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }

    .logo-icon {
      width: 28px; height: 28px;
      background: var(--red);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .logo-text {
      font-family: 'Space Mono', monospace;
      font-size: 13px; font-weight: 700;
      letter-spacing: -0.3px;
    }

    .logo-text span { color: var(--red); }

    .header-right {
      margin-left: auto;
      display: flex; gap: 6px;
    }

    .icon-btn {
      width: 26px; height: 26px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s;
    }

    .icon-btn:hover { border-color: var(--red); }

    /* BODY SECTIONS */
    .section {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--dim);
      font-family: 'Space Mono', monospace;
      margin-bottom: 8px;
    }

    /* INPUT */
    input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus { border-color: var(--red); }

    /* BUTTONS */
    .btn-row { display: flex; gap: 6px; margin-top: 8px; }

    .btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: 7px;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .btn-primary { background: var(--red); color: #fff; }
    .btn-primary:hover { background: #cc2222; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary { background: var(--surface2); color: var(--dim); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--red); color: var(--red); }

    /* STATUS */
    .status {
      font-size: 11px;
      color: var(--dim);
      margin-top: 6px;
      min-height: 16px;
      font-family: 'Space Mono', monospace;
    }

    /* MODE TOGGLE */
    .mode-row { display: flex; gap: 6px; }

    .mode-btn {
      flex: 1; padding: 7px;
      border-radius: 7px;
      font-size: 11px; font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--dim);
      transition: all 0.15s;
      font-family: 'DM Sans', sans-serif;
    }

    .mode-btn.active {
      background: rgba(255,68,68,0.12);
      border-color: var(--red);
      color: var(--red);
    }

    /* TIMER */
    .timer-display {
      font-family: 'Space Mono', monospace;
      font-size: 30px;
      font-weight: 700;
      color: var(--red);
      text-align: center;
      letter-spacing: -1px;
      margin: 4px 0 8px;
    }

    /* STATS */
    .stats-row { display: flex; gap: 6px; }

    .stat-box {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
    }

    .stat-num {
      font-size: 18px;
      font-weight: 700;
      color: var(--red);
      font-family: 'Space Mono', monospace;
    }

    .stat-lbl { font-size: 9px; color: var(--dim); margin-top: 1px; }

    /* REWIRE BTN */
    .rewire-btn {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--dim);
      transition: all 0.15s;
      font-family: 'DM Sans', sans-serif;
    }

    .rewire-btn:hover, .rewire-btn.active {
      background: rgba(255,68,68,0.1);
      border-color: var(--red);
      color: var(--red);
    }

    /* DASHBOARD BTN */
    .dash-btn {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--dim);
      transition: all 0.15s;
      font-family: 'Space Mono', monospace;
    }

    .dash-btn:hover { border-color: var(--red); color: var(--red); }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="logo-icon">🎯</div>
    <div class="logo-text">Focus<span>Rewire</span></div>
    <div class="header-right">
      <button class="icon-btn" title="Analytics Dashboard" id="dashboardBtn">📊</button>
    </div>
  </div>

  <!-- TOPIC INPUT -->
  <div class="section">
    <div class="section-label">Focus Topic</div>
    <input type="text" id="topicInput" placeholder="e.g. Machine Learning, React, DSA" />
    <div class="btn-row">
      <button class="btn btn-primary" id="activateBtn">⚡ Activate</button>
      <button class="btn btn-secondary" id="deactivateBtn" style="display:none">✕ Stop</button>
    </div>
    <div class="status" id="statusMsg">No active session.</div>
  </div>

  <!-- MODE -->
  <div class="section">
    <div class="section-label">Mode</div>
    <div class="mode-row">
      <button class="mode-btn active" id="strictBtn">🔒 Strict</button>
      <button class="mode-btn" id="casualBtn">😌 Casual</button>
    </div>
  </div>

  <!-- TIMER -->
  <div class="section">
    <div class="section-label">Focus Timer</div>
    <div class="timer-display" id="timerDisplay">25:00</div>
    <div class="btn-row">
      <button class="btn btn-primary" id="timerBtn">▶ Start</button>
      <button class="btn btn-secondary" id="resetTimerBtn">↺ Reset</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="section">
    <div class="section-label">Today's Stats</div>
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num" id="blockedCount">0</div>
        <div class="stat-lbl">Blocked</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="shortsCount">0</div>
        <div class="stat-lbl">Shorts</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="timeSaved">0m</div>
        <div class="stat-lbl">Saved</div>
      </div>
    </div>
  </div>

  <!-- REWIRE MODE -->
  <div class="section">
    <button class="rewire-btn" id="rewireBtn">🔁 Platform Rewire Mode</button>
  </div>

  <!-- DASHBOARD LINK -->
  <div class="section" style="border-bottom:none">
    <button class="dash-btn" id="dashboardBtn2">📊 Open Full Analytics Dashboard →</button>
  </div>

  <script src="popup.js"></script>
  <script>
    // Wire second dashboard button
    document.getElementById("dashboardBtn2").addEventListener("click", () => {
      chrome.tabs.create({ url: chrome.runtime.getURL("dashboard.html") });
    });
  </script>
</body>
</html>
